<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Usuario | Jumbo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1"><i class="fa-solid fa-user-pen me-2"></i>Editar Trabajador</span>
            <a href="{% url 'mantenedor_usuarios' %}" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-arrow-left me-2"></i>Volver al Mantenedor</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-0">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h4 class="mb-0 fw-bold"><i class="fa-solid fa-user-gear me-2"></i>Modificar Perfil: {{ usuario.username }}</h4>
                    </div>
                    <div class="card-body p-4">
                        <form method="POST">
                            {% csrf_token %}
                            
                            <!-- Campo Nombre de Usuario (solo lectura) -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">Nombre de Usuario</label>
                                {{ form.username }}
                            </div>

                            <!-- Campo Correo Electrónico -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">Correo Electrónico</label>
                                {{ form.email }}
                            </div>

                            <!-- Campo Grupo / Rol -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">Rol en el Sistema (Grupo)</label>
                                {{ form.grupo }}
                            </div>

                            <!-- Campo Sueldo Base -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">Sueldo Base ($)</label>
                                {{ form.sueldo_base }}
                            </div>

                            <hr class="my-4">

                            <div class="d-flex justify-content-between">
                                <a href="{% url 'mantenedor_usuarios' %}" class="btn btn-secondary px-4">Cancelar</a>
                                <button type="submit" class="btn btn-primary px-4"><i class="fa-solid fa-floppy-disk me-2"></i>Guardar Cambios</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
