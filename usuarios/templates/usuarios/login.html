{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión | Portal Jumbo</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --jumbo-green: #008539;
            --jumbo-dark: #005826;
        }
        body {
            background-color: #f4f6f9;
        }
        .bg-jumbo {
            background-color: var(--jumbo-green) !important;
        }
        .btn-jumbo {
            background-color: var(--jumbo-green);
            color: white;
            border: none;
        }
        .btn-jumbo:hover {
            background-color: var(--jumbo-dark);
            color: white;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <!-- SweetAlert2 para errores de inicio de sesión -->
    {% if form.errors or messages %}
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            Swal.fire({
                icon: 'error',
                title: 'Error de Acceso',
                text: 'Usuario o contraseña incorrectos. Por favor intenta de nuevo.',
                confirmButtonColor: '#008539'
            });
        });
    </script>
    {% endif %}

    <div class="card shadow-lg border-0" style="width: 25rem; border-radius: 15px;">
        <div class="card-header text-center bg-jumbo text-white" style="border-top-left-radius: 15px; border-top-right-radius: 15px; padding: 25px;">
            <!-- Logo Jumbo -->
            <img src="{% static 'images/USUARIO.png' %}" alt="Jumbo Logo" width="130" class="mb-2 img-fluid">
            <h4 class="mb-0 fw-bold">Portal Jumbo</h4>
            <small class="text-white-50">Acceso a Gestión y Mantenedores</small>
        </div>
        
        <div class="card-body p-4 text-dark">
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold"><i class="fa-solid fa-user me-1"></i>Nombre de usuario</label>
                    <input type="text" name="username" class="form-control" required placeholder="Ingresa tu usuario">
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold"><i class="fa-solid fa-key me-1"></i>Contraseña</label>
                    <input type="password" name="password" class="form-control" required placeholder="••••••••">
                </div>
                
                <button type="submit" class="btn btn-jumbo w-100 fw-bold py-2 shadow-sm">
                    <i class="fa-solid fa-right-to-bracket me-2"></i>Ingresar
                </button>
            </form>
            
            <div class="text-center mt-3">
                <a href="{% url 'password_reset' %}" class="text-decoration-none text-muted small fw-bold">
                    <i class="fa-solid fa-circle-question me-1"></i>¿Olvidaste tu contraseña?
                </a>
            </div>
            
            <div class="text-center mt-3 border-top pt-2">
                <a href="{% url 'home_bodega' %}" class="text-success small fw-semibold text-decoration-none">
                    <i class="fa-solid fa-arrow-left me-1"></i>Volver al Menú Principal
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
