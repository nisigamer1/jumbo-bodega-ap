<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Jumbo - Sistema de Gestión{% endblock %}</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --jumbo-green: #008539;
            --jumbo-dark: #005826;
            --jumbo-yellow: #ffc107;
        }
        .bg-jumbo { background-color: var(--jumbo-green) !important; }
        .btn-jumbo { background-color: var(--jumbo-green); color: white; }
        .btn-jumbo:hover { background-color: var(--jumbo-dark); color: white; }
        .navbar-brand-jumbo { font-weight: 800; font-size: 1.5rem; letter-spacing: 1px; color: white !important; }
        .card-header-jumbo { background-color: var(--jumbo-green); color: white; font-weight: bold; }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Navbar Jumbo -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
        <div class="container-fluid px-4">
            <!-- Logo / Inicio -->
            <a class="navbar-brand navbar-brand-jumbo" href="{% url 'home_bodega' %}">
                <i class="fa-solid fa-cart-shopping me-2"></i>JUMBO <span class="fs-6 fw-normal">| Bodega & Sala AP</span>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <!-- Vínculo a Empleados -->
                    <li class="nav-item">
                        <a class="nav-link text-white fw-semibold" href="{% url 'empleados' %}">
                            <i class="fa-solid fa-users me-1"></i> Trabajadores Jumbo
                        </a>
                    </li>

                    <!-- Vínculo a Productos -->
                    <li class="nav-item">
                        <a class="nav-link text-white fw-semibold" href="{% url 'bodega_productos' %}">
                            <i class="fa-solid fa-boxes-stacked me-1"></i> Inventario Bodega/Sala
                        </a>
                    </li>

                    <!-- Vínculo a Fecha Actual -->
                    <li class="nav-item">
                        <a class="nav-link text-white fw-semibold" href="{% url 'bodega_ahora' %}">
                            <i class="fa-solid fa-clock me-1"></i> Hora Servidor
                        </a>
                    </li>

                    <!-- Admin -->
                    <li class="nav-item ms-lg-2">
                        <a class="nav-link bg-warning text-dark fw-bold rounded px-3" href="/admin" target="_blank">
                            <i class="fa-solid fa-user-gear me-1"></i> Admin
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal Dinámico -->
    <main class="container my-4 flex-grow-1">
        {% block contenido %}
        {% endblock %}
    </main>

    <!-- Pie de página con bibliografía e información académica -->
    <footer class="text-center py-3 bg-white border-top mt-auto">
        <div class="container">
            <p class="text-muted mb-0 fw-semibold">
                Evaluación Sumativa N°2 - Ingeniería en Informática / Analista Programador | INACAP La Serena 2026
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
