<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>django - bodega</title>
</head>
<body>
    <h1>bienvenido a bodega</h1>
    <ul>
        <li>nombre:{{nombre}}</li>
        <li>apellidos:{{apellidos}}</li>
        {% if cargo == "bodeguero" %}
        <li>cargo:{{cargo}} </li>
        {% else %}
        <li>cargo: no informado  </li>
        {% endif %}
    </ul>
</body>
</html>
