<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Producto | Jumbo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1"><i class="fa-solid fa-pen-to-square me-2"></i>Editar Producto</span>
            <a href="{% url 'mantenedor_productos' %}" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-arrow-left me-2"></i>Volver al Mantenedor</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-warning text-dark fw-bold">
                        <i class="fa-solid fa-box me-2"></i>Modificando: {{ form.instance.nombre }}
                    </div>
                    <div class="card-body">
                        <form method="POST">
                            {% csrf_token %}
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Código EAN / SKU</label>
                                    {{ form.codigo_barras }}
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Nombre del Producto</label>
                                    {{ form.nombre }}
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Categoría</label>
                                    {{ form.categoria }}
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Precio ($)</label>
                                    {{ form.precio }}
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Stock Sala</label>
                                    {{ form.stock_sala }}
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Stock Bodega</label>
                                    {{ form.stock_bodega }}
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Fecha Próx. Vencimiento</label>
                                    {{ form.fecha_vencimiento }}
                                </div>
                                <div class="col-md-12 form-check mb-3 ms-3">
                                    {{ form.en_oferta }}
                                    <label class="form-check-label text-muted">¿Producto en Oferta?</label>
                                </div>
                            </div>
                            
                            <div class="d-flex justify-content-end gap-2 mt-4">
                                <a href="{% url 'mantenedor_productos' %}" class="btn btn-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-warning fw-bold"><i class="fa-solid fa-save me-2"></i>Guardar Cambios</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
